<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KuroCat · 猪猪侠皮肤</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe5;color:#3d2928;font:14px/1.6 system-ui}main{max-width:1260px;padding:36px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d8cbb9;padding-bottom:18px}header b{letter-spacing:1px}header span{font-size:12px;color:#8e7762}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) 1fr;gap:48px;align-items:center}.stage{position:relative;background:radial-gradient(ellipse at 50% 60%,#fffbf2,transparent 70%);min-height:640px}canvas{width:100%;height:640px;display:block}.eyebrow{font-size:11px;letter-spacing:2px;color:#a15738}h1{font-size:40px;line-height:1.3;margin:12px 0 20px}h1 em{font-style:normal;color:#b62d34}p{color:#927560}label{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:12px}select{background:#fffaf1;border:1px solid #d7c4b2;border-radius:8px;padding:8px;color:#5d3b30}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}button{border:1px solid #d4bb9d;background:#fff8e9;border-radius:10px;padding:12px;cursor:pointer;color:#633d2d}button:hover{background:#f8e4c5}button.primary{background:#b82e36;color:white;border-color:#b82e36}.hint{font-size:11px;text-align:center;margin-top:-8px;color:#9c8268}.tag{display:inline-block;background:#e9ddc9;border-radius:20px;padding:3px 10px;font-size:11px;margin-top:20px}footer{border-top:1px solid #d8cbb9;margin-top:25px;padding-top:16px;font-size:11px;color:#977f68}a{color:#9a4930}@media(max-width:800px){main{padding:22px}.layout{grid-template-columns:1fr;gap:8px}canvas,.stage{height:480px;min-height:480px}h1{font-size:30px}}</style><main><header><b>KUROCAT / GG BOND</b><span>猪猪侠 · 角色皮肤</span></header><div class="layout"><div><div class="stage"><canvas id="pet"></canvas></div><div class="hint">直接敲键盘，或在角色周围移动鼠标。此网页只接收本页输入。</div></div><aside><div class="eyebrow">跟着每一次敲击</div><h1>手到键上，<br><em>才有打字的感觉。</em></h1><p>双手轮流落键，抬手跨过键帽。<br>握住鼠标时，另一只手继续敲字。</p><label>角色<select id="skin"><option value="ggbond">🐷 猪猪侠</option><option value="dafeiyu">🐳 大肥鱼 · 原版参考</option><option value="black">🐈‍⬛ 小黑猫</option></select></label><label>键盘<select id="layout"><option value="65">65% 紧凑键盘</option><option value="108">108 键完整键盘</option></select></label><label>方向<select id="orientation"><option value="cat">面向角色 · 空格在远侧</option><option value="viewer">面向观众 · 字母正向</option></select></label><div class="buttons"><button class="primary" id="keys">演示逐键移动</button><button id="mouse">演示鼠标跟随</button><button id="both">同时操作键鼠</button><button id="combo">演示连击奖励</button><button id="privacy">预览隐私状态</button><button id="reset">停止并复位</button></div><div class="tag" id="state">可以开始打字了</div><p style="font-size:11px">使用 KuroCat 原生键盘投影、按键反馈和鼠标。猪猪侠以“大肥鱼”的角色渲染结构接入，保留连击表情与奖励。</p></aside></div><footer>本地定制版 · <a href="https://github.com/qianyiai/kurocat">KuroCat / MIT</a> · 不保存输入文字</footer></main><script type="module" src="/src/ggbondPreview.ts"></script></html>
